version: 2

models:
  - name: stg_ecommerce__order_items
    description: "Line items from orders"
    columns:
      - name: id
        description: ""
        data_type: INTEGER
        tests:
          - not_null
          - unique
        

      - name: order_id
        description: ""
        data_type: INTEGER
        tests:
          - not_null


      - name: user_id
        description: ""
        data_type: INTEGER
        tests:
          - not_null

      - name: product_id
        description: ""
        data_type: INTEGER
        tests:
          - not_null


      - name: inventory_item_id
        description: ""

      - name: status
        description: ""
        tests:
          - not_null
          - accepted_values:
              name: unexpected_order_status # We can name our tests to make it easier to give more meaningful errors
              values:
                - Processing
                - Cancelled
                - Shipped
                - Complete
                - Returned

      - name: created_at
        description: ""

      - name: shipped_at
        description: ""

      - name: delivered_at
        description: ""

      - name: returned_at
        description: ""

      - name: sale_price
        data_type: FLOAT64
        description: "How much the item sold for"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0