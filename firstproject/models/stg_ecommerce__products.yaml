version: 2

models:
  - name: stg_ecommerce__products
    description: "products table"
    columns:
      - name: id
        description: "Primary key"
        tests:
          - not_null 
          - unique

      - name: cost
        description: ""

      - name: category
        description: ""

      - name: name
        description: ""

      - name: brand
        description: ""

      - name: retail_price
        description: ""

      - name: department
        description: ""
        tests:
          - not_null
          - accepted_values:
              name: unmatched_value 
              values:
                - Men
                - Women


      - name: sku
        description: ""

      - name: distribution_center_id
        description: ""